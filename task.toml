name = "release-defects"

# The verifier reads only these paths from the agent's final environment. Must stay top-level:
# nested under [verifier] the value is silently dropped and the verifier receives nothing.
artifacts = [
    "/app/forecast/src/",
    "/app/forecast/build.sh",
    "/app/data/",
    "/app/out/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Software"
subcategory = "Systems"
tags = ["ada", "release-engineering", "defect-reports", "forecast", "reporting-delay"]
languages = ["ada"]
difficulty = "core"
expert_time_estimate_hours = 4

difficulty_explanation = """
The release review's table divides the reports each release has collected by its installs, and on it the last five releases sit well under the line's long-run figure. The table is arithmetically right and the conclusion is wrong: a report reaches the tracker weeks or months after the release it is filed against, the median ticket about a hundred days out, so a release that shipped ten weeks ago has collected a fraction of what it will collect, and the newest releases look cleanest precisely because they are newest. The count a release reaches by day 365 is what support has to plan for, and for the youngest release it is half again what the export holds.

The product is the forecast itself, one integer per young release, scored against the count each release actually reached, together with the arrival curve those forecasts rest on. Two bars on the forecast: every release within tolerance_per_release, 0.20 on the shipped product and 0.17 on the other, and the total across the forecast releases within tolerance_total, 0.10 and 0.07. Handing in the counts as they stand fails both bars on both products, the worst release by 32 percent and the total by 17 on the shipped export. A trend fitted through the rates of the mature releases and read off at the young ones fails the per-release bar on both, worst by 50 percent on the shipped export and 76 on the other. The route that suggests itself once the delay is seen, one column-to-column growth pattern from every report of every finished release applied to each young release's count so far, fails the forecast bars on the shipped export, its worst release 56 percent off and its total 21 percent, because the youngest release's count is mostly crash reports that the ticket-dominated pattern grosses up again, and it fails the arrival curve on both products, because the crash reporter changed what a young count is made of. Crash reports land within days and are complete almost at once; tickets trickle for a year. A pattern pooled over a history that is mostly ticket-only treats a reporter-era release's crash reports as if they were still coming in and grosses them up again, and its single pooled curve, read against either source, is far outside the 0.05 arrival share bar on both products. The pattern has to be built per source, tickets from the finished releases and crash reports from the finished releases that ship the reporter, and the two ultimates added; that route lands every release inside the bar with the worst at 7.2 percent on the shipped export and 3.6 on the other. Across ten generated products the per-source method passes the forecast bars nine of ten on the shipped shape and ten of ten on the other; the pooled pattern passes none of ten on the shipped shape and ten of ten on the other, where only the arrival curve bar stops it; the counts as they stand and the rate trend pass none at all.

Two more facts separate a right reading from a plausible one, both stated in the README. A report can be marked duplicate or invalid by the tracker; that is not a defect and has to be dropped everywhere, from a column count to the total a young release divides by its curve. And reported_date is only the day the tracker logged a report: for a ticket that can trail opened_date, the day the user actually hit the bug, by a queue, and a curve has to be built from opened_date. Missing either fact still passes the shipped export, worst 7.2 percent off missing the status rule and 6.2 missing the date rule, because the shipped product carries a light dose of each. Missing either fails the other product outright: skipping the status rule totals 10.1 percent against the 7 percent bar, and skipping the date rule misses the youngest release by close to four times over, because its triage queue is long enough to push almost all of its reports out of the early columns the forecast grosses up from, and one finished release carries a duplicate storm in its first columns.

The other product is a mobile line with 42 releases, an export date of its own, tickets that take half as long again to arrive, a defect rate that is rising rather than flat, and a crash reporter that went in at release 7.16 against 4.14 here, so every one of its seven forecast releases has it and a different share of their reports arrives within days. A forecast that carries the shipped numbers fails it, and so does one that carries the shipped curves: tickets that take half as long again to arrive fill a column at a different pace, so the shipped ticket curve read against that product's counts is wrong on every release. A program that reads the pattern off the export it is handed passes. The data are synthetic, generated by solution/gen_reports.py from a per-release intensity, a lognormal ticket delay and a short crash delay, and the key is the count each release reached by day 365 in that generation, on its own clock and net of the duplicate and invalid reports; solution/calibrate.py reproduces every figure above.

The README states the relationship rather than hiding it: a report arrives some time after its release, a ticket usually months out and a crash report within days, so a young release holds only the share of its reports its age has allowed in, and the releases at least 365 days old are the record of what those shares are. It states the status and opened_date facts the same way, as rules rather than as a hint about where either one bites. The instruction states how the curve is built from the finished releases and how a forecast comes out of it, and acceptance is the two published tolerances. Disclosing it does not make the task transcription: the pooled pattern, which is what reading that paragraph and not looking at the sources gives, still fails the shipped product's bars and the arrival curve on both, and the implementation is still two csv reads, a date to day-number conversion, a table of counts by release and 30-day column, a dozen ratios and a product, in Ada against the standard library.

In a real business this job belongs to the engineer who owns the release quality metrics, and the mistake of reading the report counts of the newest releases as their quality is the single most common way a release trend gets called too early.
"""

solution_explanation = """
The reference (solution/solve.sh) installs src/forecast.adb and runs the project's build script, then runs the binary on /app/data. It reads policy.json for the export date and the forecast list, releases.csv for each release's date and whether it ships the crash reporter, and reports.csv for every report's release, source, status and opened_date.

For each release and each source it drops every report whose status is not open, then counts what is left within each 30-day column measured from opened_date, twelve columns and then everything by day 365, keeping only the columns the export holds complete for that release. The arrival curve for a source is, at each thirty-day column, the pooled count over the finished releases that had arrived by then divided by what those releases held at day 365; tickets use every finished release, crash reports the finished releases that ship the reporter. A young release's figure for a source is its count over its last complete column divided by the curve at that column, and its forecast is the ticket figure plus the crash figure, rounded to an integer; a release that carries no crash reports adds a zero for that source, so the reporter column governs only which releases build the crash curve, not whether a release gets a crash term. Everything is the Ada standard library. The policy reader takes any JSON whitespace between a colon and its value, a tab as readily as a space, and treats a horizon numeral longer than nine digits as another horizon rather than converting it, so an oversized figure gets the same standard error line and exit 3 as a plain wrong one.

On the shipped export the forecasts are 245, 466, 80, 194 and 372 against counts reached of 242, 466, 80, 209 and 360, the worst 7.2 percent off and the total exactly on; on the other product the forecasts are 186, 658, 616, 920, 625, 1113 and 634 against 191, 635, 614, 888, 640, 1138 and 637, the worst 3.6 percent off and the total 0.2. The worst release on each export is the one carrying a batch of tickets opened on its own column edge, which the contract's strict boundary leaves out of the count the forecast grosses up: the release collects those reports, the curve does not predict them, and the reference is short by exactly them. The wrong routes are each a small change to the same program: oracle_to_date writes the counts as they stand, status and queue included, oracle_pooled_ladder builds one growth pattern from every report of every release, and oracle_rate_trend fits a line through reports per install of the mature releases and scales it by installs.

The last complete thirty-day column a release divides its forecast by is floor((age+1)/30), capped at twelve because the curve stops at 360 days, and this holds at every age with no separate rule for a release that has already finished collecting: whether a release is old enough to feed the arrival curve (age at least 365) and which column a forecast reads off it are two different facts, kept in two different fields, so a release exactly 365 days old still divides by the 360-day column and not by its full day-365 total. The other product's list keeps one release on it, at 400 days, well past that cutoff, precisely so the cap has a graded forecast to bind on rather than sitting unused in the formula. Both lists carry a release exactly 59 days old, one day past a thirty-day column edge, so each export exercises floor((age+1)/30) where reading floor(age/30) would pick the column below; on an ordinary release the two columns estimate the same total to within a report, so the shipped 4.31 carries a month-end close crash batch, 156 reports opened on day 58, inside its sixty-day column and outside its thirty-day one, and the lower column reads 216 against a count reached of 360.
"""

verification_explanation = """
The verifier runs in its own container. It collects the agent's Ada sources, the build script and the shipped export as artifacts, compiles the project itself with gnatmake as an unprivileged build user, and runs the binary it produced, so the graded forecast always comes out of a clean build of the agent's own code. Collection strips src/ itself to its top-level *.adb and *.ads regular files, deleting every other entry the moment the project lands, and "every other entry" is meant literally rather than as a statement about file modes: a sub-directory and everything under it goes too, so a nested tree that carries its payload in its DIRECTORY NAMES is gone rather than merely unreadable, and so does a symbolic link, or anything else that is not a plain Ada source file. Nothing an ordinary GNAT project needs is lost, since the documented gnatmake -I src build compiles out of src/ itself and never had a sub-directory on its build path. /app/out is emptied on the same terms, being a collected path too, and the instruction states both. So nothing outside the Ada source is ever on disk under /app/forecast/src for a run to reach; the build directory holds only those files, copied out of the now-stripped src/, and is built with the same command build.sh documents (gnatmake -I src on src/forecast.adb), which compiles forecast.adb and whatever units it pulls in from src/ and leaves a unit nothing references alone, as the instruction says: a submission split into forecast.adb plus ordinary Ada helper packages builds exactly as it would from the project directory itself, and a helper written any other way is simply never copied in, so it cannot be linked into the program or reached by its build. The build script is not run, and the instruction says so: a script that did the work some other way would otherwise pass with the stub in place. Nothing in the project, in /app/out or in the export directory keeps an execute bit while the graded binary runs, so a helper carried in any collected path cannot do the work for it, and /app itself is root-owned and closed to the build user, so nothing can sit as a sibling of those directories and escape the sweep by not being under any of them.

Compiling and running means the verifier executes code the agent wrote, so it does not do that as root. test.sh hands the project to the build user through setpriv with supplementary groups cleared and no-new-privileges set, runs the binary from /app/forecast, the directory the instruction documents, and while it runs every executable on the system paths is closed to that user, found by walking the directories rather than by a list, so the forecast cannot come out of a Python the binary shells out to; the cheat_python_shim arm is that construction and scores 0. Closing the system paths would still leave an executable helper shipped inside the agent's own project runnable, since that directory is collected as an artifact, so every file under /app/forecast except the binary the verifier has just built loses its execute bits before either graded run, and its read bits too, because the loader only has to read a shared object to use one. That sweep runs on the build script as well, whatever mode it happened to ship with, so the instruction's rule reads as what the harness actually does: nothing in /app/forecast is a fact about the run except the binary itself, its sub-directories included, whose names are closed off for the same reason a file's contents are, not something the agent has to manage. The instruction says so, so a program that needed a table of its own alongside the binary is not being failed by surprise. Scratch space is the remaining route: Interfaces.C is part of the Ada standard library, so a program could carry a helper as bytes, write it to /tmp, mark it executable and run it. Every single invocation of the binary runs under the same conditions, not only the two graded runs: each argument-count and horizon probe gets the identical closing of the project tree and the identical before/after listing. Both halves of that used to be privileges of the graded runs alone. A probe used to reach an open project tree, so the first probe was a window in which the collected build script and everything beside it could still be read and its contents staged somewhere for a later run to pick up, and a probe's leftovers used to be checked only against the output path it named. The listing itself turns on presence and not on a file's mode. An execute bit is not the control here: the dynamic loader is deliberately left open (see below), and it maps and runs a file the kernel would refuse to start directly, so a mode-0644 helper is every bit as usable as a mode-0755 one. Every non-directory entry under /tmp, /var/tmp, /dev/shm, /home/runner and /app entire, not only its known subdirectories, is listed on either side of each invocation, and anything new other than the one JSON that invocation was allowed throws its output away, since the instruction allows an invocation one new file and nothing else. A plain directory is not a file and is not counted, so an otherwise-correct program that happens to create one is not caught by a rule the instruction never states, and a probe's own staging directory, created before its bracket opens and removed only after it closes, never looks new to it either. Whatever either listing catches is deleted on the spot, so nothing one invocation leaves behind can ever look like it was already there to the invocation that follows it. The cheat_extra_output arm is the reference that also drops an ordinary chmod 644 log beside the binary during each run, and the cheat_scratch_leftover arm is the reference leaving a mode 0644 helper file in /tmp; neither file ever carries an execute bit, and both score 0 on that listing alone. The cheat_native_helper arm copies the binary itself into /tmp, marks it executable, execs that copy to do the whole job and deletes it before exit, so a listing taken after the call never sees it; a dedicated closure of the dynamic loader used to be what stopped it instead, but three quality-panel rounds rejected that closure because it also stops an ordinary dynamically linked GNAT binary from launching during the credential transition setpriv makes, so the loader is left open like any other shared object now. The copy loads and runs the same standard-library-only code the graded binary is built from: only src/*.adb|ads is ever compiled or collected, so running a second copy of it is the same work twice, not a route to anything else, and this arm now scores 1. A stray file the project happened to ship, such as the chmod 644 file the oracle_extra_file arm puts beside the real solution or the chmod 755 one the oracle_extra_exec_in_src arm puts there with an executable build script beside it, is not held against the run at all: collection deletes both before the build starts, so neither is ever compiled, run or graded, and both arms score exactly what the real solution scores. The instruction discloses this as what it actually is, an after-the-fact comparison: a program that leaves something executable reachable from where it ran, or any new file under /app other than the JSON it was asked for, once it returns, has that invocation's output discarded, so nothing else is graded on a file's presence, its mode going in, or its bytes. Each run happens in its own session and its process group is torn down afterwards, then every process that user still owns is swept, so nothing the agent started is alive when the reward is written. The two runs ask for different output paths, each a fresh basename test.sh draws at random, so a program that ignores the second argument and writes a fixed file produces nothing for the run it was not written for; the same generator names every argument-count and horizon probe's output path too, so no run's basename says whether it is one of the two graded runs or a probe. The output is staged only if it is a regular file, moved to a root-owned path, and pytest reads that with O_NOFOLLOW; pytest never runs the agent's binary. The keys live under /opt, readable only by root, and the /tests mount is closed to the build user before anything untrusted starts; if it is still reachable the run is abandoned with reward 0. pytest is called by full path with -P so nothing dropped into the working directory can shadow it.

Then the same binary is run on the other product's export, staged into a fresh root-owned directory only after the build has finished and its processes are gone, with its own README, and removed afterwards; the horizon probes are staged the same way from a root-owned copy of the shipped export taken before any agent code ran, so a symlink planted in /app/data is never followed by root on the way in. Every staged directory is drawn from the same bare mktemp template, and every probe and graded run alike is launched through the identical root-shell-to-setpriv chain and asked for the same kind of randomly generated output basename, so a program cannot single out a probe by argv, launch shape or output name and answer only that one differently from a graded run. That product has 42 releases, its own export date, tickets that take half as long again to arrive, a rising defect rate, a crash reporter that went in at a different release and a policy file its tracker lays out with a tab after each colon where the shipped one has a space, so its curves and its forecasts are its own and a policy reader that takes only a space for JSON whitespace refuses the 365-day horizon it was handed; four of those releases sit deliberately on facts a random schedule would not otherwise reach, and one report source pattern does the same. One release is aged 209 days (a forecast release, so floor(age/30) and the contract's floor((age+1)/30) disagree on its column), and another is aged exactly 59 days, one day past a column edge, where the same off-by-one reads the day-30 column instead of the day-60 one, a far steeper part of the curve, so its forecast moves by hundreds; one is aged exactly 365 (on the finished cohort's inclusive cutoff, at least 365 days old), installed far more widely than an ordinary release and shipped with an early crash-reporter build whose reports arrive slowly, so leaving it out of the cohort moves the day-30 crash share by well over the bar, while every forecast release, all older than a month, divides by a later column the release no longer disturbs; and one is aged 400 days, kept on the forecast list well after finishing, so a forecast that never caps its column count at twelve reaches past the published curve instead of matching a route that does. Separately, one release from before the crash reporter shipped carries a real batch of crash reports of its own, from an early pilot build that phoned them home in slow weekly syncs; its own crash_reporter column still reads no, so a curve that pools crash reports by whether a release happens to carry any, rather than by that column, pools this batch in and comes out visibly slower than the correct one.

Sixty-five checks run and every one of them is a requirement instruction.md states. Every file shipped in /app/data, the three tracker files and the README, is unaltered by sha256 and nothing has been added or removed. Every argument count from zero through forty other than two is run, all forty of them: the instruction bounds the promise to that range and the verifier exhausts it, so there is no count inside the promise a program could answer differently and still pass, which a sample of ten could not say. Each has to reach standard error, leave standard output empty, exit 2 and create no file at the output path it was given, checked directly against that one path rather than by a system-wide sweep; standard output is compared as the exact bytes captured, so a lone newline is not empty, where a stripped comparison used to let a blank line through (the cheat_whitespace_stdout arm is the reference plus one New_Line on that path: it scored 1 before and 0 now); a call of zero or one arguments names no such path at all, so there is nothing more to check there than exit status and standard error; every one of these probes, and every horizon probe below, runs with the project closed exactly as a graded run does and has to pass the same leftover-file check, so a probe is not a privileged window in which the collected project can still be read, and a file one of them plants cannot outlive the probe that planted it. The instruction does not fix the wording of what reaches standard error, so nothing narrower than non-empty is enforced there. The horizon gets seven cases of its own as well, thirty, ninety, both neighbors of 365, two values further out and a twenty-digit numeral no integer type holds, and those seven are exactly the seven the instruction names, one for one, so nothing wider is promised than is graded: staging a whole export for a horizon costs a copy of the report log, which rules out exhausting a range the way the argument counts are exhausted, and both graded exports say 365, so without these cases a program that never read the key would pass: each has to say so on standard error, create no output file and exit 3; nothing is asked of standard output on that path, so nothing is checked. On each of the two runs: the output is one object with exactly the keys reports_by_day_365 and arrival_share; the forecast's keys are exactly that export's forecast_releases and its values non-negative integers; every forecast is within the policy's tolerance_per_release of the count the release reached by day 365; the summed forecasts are within tolerance_total of the summed counts; the arrival curve carries a ticket and a crash series at every thirty-day age from 30 to 360, each a share between 0 and 1; every point of each series is within 0.05 of the curve the export's own finished releases carry; and each forecast is the release's reports over its last whole column divided by the report's own printed curve at that column, the two sources added, within one report of rounding, so the curve printed is the curve the forecast actually used. Each printed share is read as exact only to its last printed digit, so a share printed as 0.10 stands for any divisor from 0.095 to 0.105 and the recomputed forecast is a range the printed one has to fall inside: a curve printed to two decimals passes as readily as one printed to ten, and the instruction says so, while a forecast that was not divided by the curve beside it still cannot.

The key is what each release actually reached, net of anything the tracker marked duplicate or invalid: the generator draws every report with its delay and its status, and the key is the number per release that arrived open by day 365, so the forecast bars are performance bars on the agent's numbers against labels the verifier holds, in the same shape as a retrieval task scored against an answer key. The arrival curve is graded differently and deliberately so: the verifier recomputes it from the finished releases in the very export the run was handed, so that check compares the run against its own input and holds nothing back. That is what makes the calibration a stated requirement with an assertion behind it rather than an instruction nobody could check. It also binds: across both exports the per-source estimators a reader might pick, pooled or averaged over releases, agree with each other to within 0.005, while a curve pooled over both sources misses the 0.05 bar by a wide margin on both products, its pooled ticket points landing more than 0.2 away from what the finished releases carry on the other export, as the oracle_pooled_ladder arm shows. One more check is on the fixture rather than on the run: at least one forecast release in each export has to carry a batch of open reports opened exactly on its last complete column edge, big enough that reading the boundary inclusively would move that release's figure by far more than the one report the consistency check allows. Without such a release in the graded data the strict boundary is stated but never exercised, and a regeneration that dropped the case would go unnoticed; the shipped export's 4.28 carries fourteen such tickets on its sixty-day edge, thirty-four reports against the share there, and the other product's 7.35 carries twenty-one on its ninety-day edge, forty-eight reports. A second fixture check does the same for the column rule: each export has to carry a forecast release one day past a column edge, where floor((age+1)/30) and floor(age/30) disagree, on which the figure read off the lower column misses the count reached by more than that policy's tolerance_per_release and differs from the right column's figure by more than ten reports, so the rule bites at any printed precision and on the visible export alone, not only in the held-out one. An ordinary such release is not enough, its two columns estimate the same total to within a fraction of a report, so the shipped 4.31 (59 days old) carries a month-end close crash batch inside its sixty-day column and none in its thirty-day one, 216 against 360, and the other product's 7.41 (59 days old) has its crash reports grossed up by a thirty-day crash share the slow-reporter release holds at 0.69, 1431 against 1138. Twenty-seven arms run through the real verifier beside the oracle. oracle_to_date and oracle_rate_trend fail the forecast bars on both products; oracle_pooled_ladder fails the arrival curve on both products, its shipped ticket points landing 0.11, 0.08 and 0.06 above what the finished releases carry at 30, 60 and 90 days, and fails the shipped forecast bars as well, 4.28 by 20.6 percent against the 20 percent tolerance and 4.31 by 67 percent, its crash batch grossed up by the ticket pattern. oracle_frozen_curve, which measures the growth pattern once on this product and writes it into the source, and cheat_frozen, the shipped forecasts written into the source, each pass the shipped run whole and fail the other product. oracle_floor_age drops the contract's plus-one from the column formula and fails on the shipped export's 59-day 4.31, forecasting 216 against 360 reached, 40 percent off, with the curve it prints no longer dividing the forecast beside it, and on the hidden export's 59- and 209-day forecast releases the same way; oracle_floor_age_two_decimals is the same off-by-one printing its shares to two decimals, the widest band the consistency check allows, and it passed every shipped check before 4.31 carried its batch (the natural 4.31 read 215.9 against 216.0) and fails the shipped run now, 216 against a recomputed 370.7 to 376.4; oracle_strict_cohort tightens the finished-cohort test from inclusive to strict and fails the arrival curve on the hidden export's 365-day release, whose exclusion moves the day-30 crash share by more than the bar. oracle_no_cap never clamps the completed-column count to twelve and fails on the hidden export's 400-day forecast release, reaching for a column the curve does not publish instead of the twelfth; oracle_ignores_reporter pools every finished release into the crash curve whether or not it ships the reporter and fails the arrival curve bar on the hidden export's pilot release, which carries real crash reports under a crash_reporter column that still reads no. oracle_gnat_unit, which reaches for one of the compiler's own convenience packages, and cheat_python_shim, which tries to hand the work to a python one-liner, both fail to build: the GNAT hierarchy is taken out of both images, so a submission that reaches past the standard library does not compile rather than being trusted not to, and every interpreter is closed while the binary runs in any case. cheat_native_helper drops a native copy of the binary into scratch, runs it and deletes it before the leftover-executable listing runs; the dynamic loader is not closed, so the copy loads and does the same standard-library-only job the graded binary does, and it now scores 1 rather than 0, alongside the arms below that also prove the verifier does not false-reject. cheat_probe_basename answers "wrong horizon" from a fixed output basename (the old argprobe.json) instead of ever reading horizon_days out of policy.json; every run now asks for a randomly generated basename, graded and probed alike, so that name never appears, every horizon probe falls through into an ordinary run, and it scores 0 for writing a real report where the horizon checks require exit 3 and nothing written. Seven arms are the quality panel's own routes at the boundary, at the output contract and at the runtime enforcement, each one measured passing before the change that closed it and failing after (oracle_floor_age_two_decimals passed the shipped run before and fails it now; cheat_whitespace_stdout and the five below passed the whole verifier before). oracle_inclusive_count builds the arrival curve strictly, exactly as the contract says, but takes a forecast release's own count over its last complete column inclusively, and prints its shares to two decimals so the consistency check's printed-precision band is as wide as any correct program may legally make it; before the boundary batch it passed every check on both exports, and it now fails on the shipped export's 4.28 by thirty-four reports. oracle_inclusive_lag reads the boundary inclusively in the curve as well, and fails the same way. cheat_src_dir_data carries its payload in DIRECTORY NAMES under src, src/cache/k0405, and in no regular file at all, and refuses to produce output without them: it passed while the strip deleted only top-level regular files and the run-time closing of the project touched only files of type f, and scores 0 now that collection deletes every entry under src that is not a top-level Ada source. cheat_scratch_leftover leaves a mode 0644 helper file in /tmp, no execute bit, which is exactly what a file launched through the still-open dynamic loader does not need: it passed the old executable-only sweep and scores 0 against a sweep that lists every entry whatever its mode. cheat_probe_stage copies the collected build script to /tmp during the zero-argument probe and refuses to work in a graded run without it: it passed while probes ran with the project still open and their leftovers went unlisted, and scores 0 now that every invocation runs with the project closed and gets the same listing. cheat_delete_readme is the real solution with /app/data/README.md deleted afterward, everything else in the export untouched: it scores 0 because README.md is one of the files sha256 checks against the shipped copy, and the instruction says the whole directory stays as it arrived, not just the three files a program reads. Six arms score 1 rather than 0, to prove the verifier does not false-reject (cheat_native_helper above is one of them): oracle_two_decimals prints every arrival share to two decimals while dividing each forecast by the full-precision share, which meets every stated bar and passes the consistency check at its printed precision; oracle_multi_unit splits the reference into forecast.adb plus an ordinary helper package, oracle_extra_file ships a stray, non-executable file in src/ beside the real solution, and oracle_extra_exec_in_src ships a stray executable file there and leaves the build script executable too; the build directory takes every *.adb/*.ads file it is given and nothing else, and every run strips execute bits from everything else under /app/forecast regardless of its mode going in, so the split submission builds and runs like any other and the two stray files are simply never copied in, never linked, and never graded on their own account. oracle_extra_dir is the reference plus an ordinary empty directory created next to the output with Ada.Directories, part of the standard library; a directory is not a file, so the narrowed /app listing does not count it and this still scores 1. solution/gen_reports.py regenerates both products byte for byte, the shipped export and key with no arguments and the other product's with --hidden.
"""

relevant_experience = """
I have authored a batch of tasks for this edition, several of them accepted, on one finding: the tasks that measure something are the ones where the agent's own reading of the evidence confirms the wrong answer. Here the wrong answer is the review's table, reproducible to two decimals from the files shipped, and the forecast that works has to see that a young release's count is unfinished and that the two kinds of report finish on different clocks. The product is the forecast rather than a rate or an effect because a count a release reached is a fact the verifier can hold, the same shape as a list scored against an answer key.
"""

[verifier]
# One compile and two runs of the agent's program. gnatmake is fast and there is no dependency
# tree, but 1800 is the floor the platform requires.
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
# Offline by design: the tool is written against the Ada runtime, and network access would let
# the agent pull a forecasting package rather than look at the export.
network_mode = "no-network"

[environment]
# Must be "public" on every task, offline ones included: this is the phase where the image is
# built and the agent harness is installed.
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
