name = "release-defects"

# The verifier reads only these paths from the agent's final environment. Must stay top-level:
# nested under [verifier] the value is silently dropped and the verifier receives nothing.
artifacts = [
    "/app/forecast/src/",
    "/app/forecast/build.sh",
    "/app/data/",
    "/app/out/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Software"
subcategory = "Systems"
tags = ["ada", "release-engineering", "defect-reports", "forecast", "reporting-delay"]
languages = ["ada"]
difficulty = "core"
expert_time_estimate_hours = 4

difficulty_explanation = """
The release review's table divides the reports each release has collected by its installs, and on it the last five releases sit well under the line's long-run figure. The table is arithmetically right and the conclusion is wrong: a report reaches the tracker weeks or months after the release it is filed against, the median ticket about a hundred days out, so a release that shipped ten weeks ago has collected a fraction of what it will collect, and the newest releases look cleanest precisely because they are newest. The count a release reaches by day 365 is what support has to plan for, and for the youngest release it is half again what the export holds.

The product is the forecast itself, one integer per young release, scored against the count each release actually reached, together with the arrival curve those forecasts rest on. Two bars on the forecast: every release within tolerance_per_release, 0.20 on the shipped product and 0.17 on the other, and the total across the forecast releases within tolerance_total, 0.10 and 0.07. Handing in the counts as they stand fails both bars on both products, the worst release by 34 percent and the total by 17 on the shipped export. A trend fitted through the rates of the mature releases and read off at the young ones fails the per-release bar on both, worst by 50 percent on the shipped export and 58 on the other. The route that suggests itself once the delay is seen, one column-to-column growth pattern from every report of every finished release applied to each young release's count so far, also fails, the worst release by 20 percent on the shipped export and 31 on the other, because the crash reporter changed what a young count is made of. Crash reports land within days and are complete almost at once; tickets trickle for a year. A pattern pooled over a history that is mostly ticket-only treats a reporter-era release's crash reports as if they were still coming in and grosses them up again. The pattern has to be built per source, tickets from the finished releases and crash reports from the finished releases that ship the reporter, and the two ultimates added; that route lands every release inside the bar with the worst at 1.2 percent on the shipped export and 5.3 on the other. Across ten generated products it passes eight of ten on the shipped shape and nine of ten on the other, while the pooled pattern passes four of ten and none, and the other two routes pass none at all.

Two more facts separate a right reading from a plausible one, both stated in the README. A report can be marked duplicate or invalid by the tracker; that is not a defect and has to be dropped everywhere, from a column count to the total a young release divides by its curve. And reported_date is only the day the tracker logged a report: for a ticket that can trail opened_date, the day the user actually hit the bug, by a queue, and a curve has to be built from opened_date. Missing either fact still passes the shipped export, worst 3.3 percent off missing the status rule and 1.3 missing the date rule, because the shipped product carries a light dose of each. Missing either fails the other product outright, worst 17.2 percent and 48.5, because one of its finished releases carries a duplicate storm in its first columns and its triage queue runs weeks longer than the shipped product's.

The other product is a mobile line with 40 releases, an export date of its own, tickets that take half as long again to arrive, a defect rate that is rising rather than flat, and a crash reporter that went in at release 7.16 against 4.14 here, so every one of its six forecast releases has it and a different share of their reports arrives within days. A forecast that carries the shipped numbers fails it, and so does one that carries the shipped curves: tickets that take half as long again to arrive fill a column at a different pace, so the shipped ticket curve read against that product's counts is wrong on every release. A program that reads the pattern off the export it is handed passes. The data are synthetic, generated by solution/gen_reports.py from a per-release intensity, a lognormal ticket delay and a short crash delay, and the key is the count each release reached by day 365 in that generation, on its own clock and net of the duplicate and invalid reports; solution/calibrate.py reproduces every figure above.

The README states the relationship rather than hiding it: a report arrives some time after its release, a ticket usually months out and a crash report within days, so a young release holds only the share of its reports its age has allowed in, and the releases past day 365 are the record of what those shares are. It states the status and opened_date facts the same way, as rules rather than as a hint about where either one bites. The instruction states how the curve is built from the finished releases and how a forecast comes out of it, and acceptance is the two published tolerances. Disclosing it does not make the task transcription: the pooled pattern, which is what reading that paragraph and not looking at the sources gives, is the route that fails hardest, and the implementation is still two csv reads, a date to day-number conversion, a table of counts by release and 30-day column, a dozen ratios and a product, in Ada against the standard library.

In a real business this job belongs to the engineer who owns the release quality metrics, and the mistake of reading the report counts of the newest releases as their quality is the single most common way a release trend gets called too early.
"""

solution_explanation = """
The reference (solution/solve.sh) installs src/forecast.adb and runs the project's build script, then runs the binary on /app/data. It reads policy.json for the export date and the forecast list, releases.csv for each release's date and whether it ships the crash reporter, and reports.csv for every report's release, source, status and opened_date.

For each release and each source it drops every report whose status is not open, then counts what is left within each 30-day column measured from opened_date, twelve columns and then everything by day 365, keeping only the columns the export holds complete for that release. The arrival curve for a source is, at each thirty-day column, the pooled count over the finished releases that had arrived by then divided by what those releases held at day 365; tickets use every finished release, crash reports the finished releases that ship the reporter. Each share is rounded to the four places the report prints before it is used, so the figure the forecast divides by is exactly the one written under arrival_share. A young release's figure for a source is its count over its last complete column divided by the curve at that column, and its forecast is the ticket figure plus, for a reporter release, the crash figure, rounded to an integer. Everything is the Ada standard library.

On the shipped export the forecasts are 245, 466, 80 and 194 against counts reached of 242, 466, 80 and 195, the worst 1.2 percent off and the total 0.2 percent off; on the other product the forecasts are 187, 659, 619, 911, 878 and 585 against 192, 633, 618, 865, 880 and 594, the worst 5.3 percent off and the total 1.5. The wrong routes are each a small change to the same program: oracle_to_date writes the counts as they stand, status and queue included, oracle_pooled_ladder builds one growth pattern from every report of every release, and oracle_rate_trend fits a line through reports per install of the mature releases and scales it by installs.

The last complete thirty-day column a release divides its forecast by is floor((age+1)/30), capped at twelve because the curve stops at 360 days, and this holds at every age with no separate rule for a release that has already finished collecting: whether a release is old enough to feed the arrival curve (age at least 365) and which column a forecast reads off it are two different facts, kept in two different fields, so a release exactly 365 days old still divides by the 360-day column and not by its full day-365 total.
"""

verification_explanation = """
The verifier runs in its own container. It collects the agent's Ada sources, the build script and the shipped export as artifacts, compiles the project itself with gnatmake as an unprivileged build user, and runs the binary it produced, so the graded forecast always comes out of a clean build of the agent's own code. The build directory holds only the *.adb and *.ads files copied out of the collected src/, nothing else, and is built with the same command build.sh documents (gnatmake -I src on src/forecast.adb): a submission split into forecast.adb plus ordinary Ada helper packages builds exactly as it would from the project directory itself, and a helper written any other way is simply never copied in, so it cannot be linked into the program or reached by its build. The build script is not run, and the instruction says so: a script that did the work some other way would otherwise pass with the stub in place. Nothing in the project, in /app/out or in the export directory keeps an execute bit while the graded binary runs, so a helper carried in any collected path cannot do the work for it, and /app itself is root-owned and closed to the build user, so nothing can sit as a sibling of those directories and escape the sweep by not being under any of them.

Compiling and running means the verifier executes code the agent wrote, so it does not do that as root. test.sh hands the project to the build user through setpriv with supplementary groups cleared and no-new-privileges set, runs the binary from /app/forecast, the directory the instruction documents, and while it runs every executable on the system paths is closed to that user, found by walking the directories rather than by a list, so the forecast cannot come out of a Python the binary shells out to; the cheat_python_shim arm is that construction and scores 0. Closing the system paths would still leave an executable helper shipped inside the agent's own project runnable, since that directory is collected as an artifact, so every file under /app/forecast except the binary the verifier has just built loses its execute bits before either graded run, and its read bits too, because the loader only has to read a shared object to use one. The instruction says so, so a program that needed a table of its own alongside the binary is not being failed by surprise. Scratch space is the remaining route: Interfaces.C is part of the Ada standard library, so a program could carry a helper as bytes, write it to /tmp and run it. Each graded run is bracketed by a listing of the executable files under /tmp, /var/tmp, /dev/shm and /home/runner, and under /app entire, not only its known subdirectories, and anything newly executable throws that run's output away. A file that never gains an execute bit, such as the stray, chmod 644 file the oracle_extra_file arm ships beside the real solution, is left alone: the instruction discloses only that files left executable elsewhere discard a run's output, so nothing else is graded on the file's presence or its bytes. Each run happens in its own session and its process group is torn down afterwards, then every process that user still owns is swept, so nothing the agent started is alive when the reward is written. The two runs ask for different output paths, /app/out/forecast.json and /app/out/forecast_second.json, so a program that ignores the second argument and writes a fixed file produces nothing for the run it was not written for. The output is staged only if it is a regular file, moved to a root-owned path, and pytest reads that with O_NOFOLLOW; pytest never runs the agent's binary. The keys live under /opt, readable only by root, and the /tests mount is closed to the build user before anything untrusted starts; if it is still reachable the run is abandoned with reward 0. pytest is called by full path with -P so nothing dropped into the working directory can shadow it.

Then the same binary is run on the other product's export, staged into a fresh root-owned directory only after the build has finished and its processes are gone, with its own README, and removed afterwards; the horizon probes are staged the same way from a root-owned copy of the shipped export taken before any agent code ran, so a symlink planted in /app/data is never followed by root on the way in. Every staged directory is drawn from the same bare mktemp template, so a program cannot single out a probe by argv and answer only that one differently from a graded run. That product has 40 releases, its own export date, tickets that take half as long again to arrive, a rising defect rate and a crash reporter that went in at a different release, so its curves and its forecasts are its own; two of those releases sit deliberately on formula boundaries a random schedule would not otherwise hit, one aged 209 days (a forecast release, so floor(age/30) and the contract's floor((age+1)/30) disagree on its column) and one aged exactly 365 (past the finished-cohort's own inclusive cutoff).

Twenty-eight checks run and every one of them is a requirement instruction.md states. The three shipped files are unaltered by sha256 and nothing has been added beside them. Every wrong argument count from zero to eight, other than two, is run, not a sample of them. Each has to reach standard error, leave standard output empty, exit 2 and put nothing in any writable location the process can reach (its own directory, /app, scratch space, the runner's home), which is checked by a full snapshot of those locations on either side rather than by watching one path. The instruction does not fix the wording of what reaches standard error, so nothing narrower than non-empty is enforced there. The horizon gets six cases of its own as well, thirty, ninety, both neighbors of 365 and two values further out, because both graded exports say 365 and a program that never read the key, or that special-cased the one horizon a verifier might sample, would otherwise pass: each has to say so on standard error, write nothing and exit 3; nothing is asked of standard output on that path, so nothing is checked. On each of the two runs: the output is one object with exactly the keys reports_by_day_365 and arrival_share; the forecast's keys are exactly that export's forecast_releases and its values non-negative integers; every forecast is within the policy's tolerance_per_release of the count the release reached by day 365; the summed forecasts are within tolerance_total of the summed counts; the arrival curve carries a ticket and a crash series at every thirty-day age from 30 to 360, each a share between 0 and 1; every point of each series is within 0.05 of the curve the export's own finished releases carry; and each forecast is the release's reports over its last whole column divided by the report's own curve at that column, the two sources added, within one of rounding, so the curve printed is the curve the forecast used and not a rounded copy of something else.

The key is what each release actually reached, net of anything the tracker marked duplicate or invalid: the generator draws every report with its delay and its status, and the key is the number per release that arrived open by day 365, so the forecast bars are performance bars on the agent's numbers against labels the verifier holds, in the same shape as a retrieval task scored against an answer key. The arrival curve is graded differently and deliberately so: the verifier recomputes it from the finished releases in the very export the run was handed, so that check compares the run against its own input and holds nothing back. That is what makes the calibration a stated requirement with an assertion behind it rather than an instruction nobody could check. It also binds: across both exports the per-source estimators a reader might pick, pooled or averaged over releases, agree with each other to within 0.005, while a curve built without separating the sources is 0.11 out on the shipped export and 0.25 on the other for tickets, and worse than 0.63 for crash reports on either, against a bar of 0.05. Ten arms run through the real verifier beside the oracle. oracle_to_date, oracle_rate_trend and oracle_pooled_ladder each fail the forecast bars on both products, and oracle_pooled_ladder fails the arrival curve on both as well. oracle_frozen_curve, which measures the growth pattern once on this product and writes it into the source, and cheat_frozen, the shipped forecasts written into the source, each pass the shipped run whole and fail the other product. oracle_floor_age drops the contract's plus-one from the column formula and fails on the hidden export's 209-day forecast release; oracle_strict_cohort tightens the finished-cohort test from inclusive to strict and fails on the hidden export's 365-day release. oracle_gnat_unit, which reaches for one of the compiler's own convenience packages, and cheat_python_shim, which tries to hand the work to a python one-liner, both fail to build: the GNAT hierarchy is taken out of both images, so a submission that reaches past the standard library does not compile rather than being trusted not to, and every interpreter is closed while the binary runs in any case. Two arms score 1 rather than 0, to prove the verifier does not false-reject: oracle_multi_unit splits the reference into forecast.adb plus an ordinary helper package, and oracle_extra_file ships a stray, non-executable file in src/ beside the real solution; the build directory takes every *.adb/*.ads file it is given and nothing else, so the first builds and runs like any other submission, and the second is simply never copied in, never linked, and never graded on its own account. solution/gen_reports.py regenerates both products byte for byte, the shipped export and key with no arguments and the other product's with --hidden.
"""

relevant_experience = """
I have authored a batch of tasks for this edition, several of them accepted, on one finding: the tasks that measure something are the ones where the agent's own reading of the evidence confirms the wrong answer. Here the wrong answer is the review's table, reproducible to two decimals from the files shipped, and the forecast that works has to see that a young release's count is unfinished and that the two kinds of report finish on different clocks. The product is the forecast rather than a rate or an effect because a count a release reached is a fact the verifier can hold, the same shape as a list scored against an answer key.
"""

[verifier]
# One compile and two runs of the agent's program. gnatmake is fast and there is no dependency
# tree, but 1800 is the floor the platform requires.
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
# Offline by design: the tool is written against the Ada runtime, and network access would let
# the agent pull a forecasting package rather than look at the export.
network_mode = "no-network"

[environment]
# Must be "public" on every task, offline ones included: this is the phase where the image is
# built and the agent harness is installed.
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
