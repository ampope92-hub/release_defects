name = "release-defects"

# The verifier reads only these paths from the agent's final environment. Must stay top-level:
# nested under [verifier] the value is silently dropped and the verifier receives nothing.
artifacts = [
    "/app/forecast/src/",
    "/app/forecast/build.sh",
    "/app/data/",
    "/app/out/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Software"
subcategory = "Systems"
tags = ["ada", "release-engineering", "defect-reports", "forecast", "reporting-delay"]
languages = ["ada"]
difficulty = "core"
expert_time_estimate_hours = 4

difficulty_explanation = """
The release review's table divides the reports each release has collected by its installs, and on it the newest releases sit well under the line's long-run figure. The table is arithmetically right and the conclusion is wrong: a report reaches the tracker weeks or months after the release it is filed against, the median ticket about a hundred days out, so a release that shipped ten weeks ago has collected a fraction of what it will collect, and the newest releases look cleanest precisely because they are newest. The count a release reaches by day 365 is what support has to plan for, and for the release ten weeks old it is half again what the export holds.

The instruction names the two outputs and what each is held to: a forecast per listed release, scored against the count the release actually reached, within tolerance_per_release each (0.20 on the shipped product, 0.17 on the other) and within tolerance_total in sum (0.10 and 0.07); and the per-source arrival curve the forecasts rest on, the share of the finished releases' day-365 reports, taken together as one pile, opened by each thirty-day age, within 0.05 of what those releases give. The method is written out in the README, under "How the forecast is made", rule for rule: which reports count, how each curve is pooled and from which releases, which age a release reads its shares at, and what a finished release, a release under thirty days old and a zero share get. What is left to the agent is to read the export the way the README says while the review's own table, reproducible to two decimals from the files, says the opposite, and to carry the method into Ada against the standard library with every edge in the data in play. Handing in the counts as they stand fails both bars on both products, the worst release by 34 percent and the total by 14 on the shipped export. A trend fitted through the rates of the mature releases and read off at the young ones fails the per-release bar on both products, worst by 85 percent on the shipped export and 76 on the other. The route that suggests itself once the delay is seen, one column-to-column growth pattern from every report of every finished release applied to each young release's count so far, fails the forecast bars on the shipped export, its youngest release 52 percent over and its total 14 percent, because that release's count is mostly crash reports that the ticket-dominated pattern grosses up again, and it fails the arrival curve on both products, since a single pooled curve read against either source is far outside the 0.05 bar. Crash reports land within days and are complete almost at once; tickets trickle for a year. The pattern has to be built per source, tickets from the finished releases and crash reports from the finished releases that ship the reporter, and the two ultimates added; that route lands every release inside the bar with the worst at 2.1 percent on the shipped export and 5.6 on the other. Across ten generated products the per-source method passes the forecast bars ten of ten on both shapes; the pooled pattern passes none of ten on the shipped shape and ten of ten on the other, where only the arrival curve bar stops it; the counts as they stand and the rate trend pass none at all.

The README states four facts about the data and the instruction one definition, and each one, missed, moves a point of the shipped export's own curve by more than the bar. The export date is included, so a release at least 365 days old has its whole day-365 record in the file: 4.32 is exactly 365 days old, a major push whose early crash-reporter build uploaded on a monthly sync, and a cohort that starts one day later moves the thirty-day crash share by 0.25. That same sync puts every one of its crash reports on day 30, 60 or 90 exactly, so the instruction's "opened by that age, the day itself included" is load-bearing: a curve that reads "by day 30" as "before day 30" drops the whole day-30 batch and reads the thirty-day crash share 0.25 low and the sixty-day share 0.25 low, and grosses the youngest release 23 percent over its count. The crash reporter went in with 4.14, and 4.13 carries crash rows of its own from a pilot build that synced weekly: a crash curve that pools any release holding crash rows, instead of the releases marked yes, reads 0.16 low at thirty days. A duplicate or invalid report is not a defect: 4.8 carries a storm of two thousand of them in its first three months, and a curve that counts them reads the ninety-day ticket share 0.14 high. reported_date is the day the tracker logged a ticket, a couple of weeks after opened_date as a rule: a curve built on it reads the thirty-day ticket share 0.10 low. Each of those also fails the other product, where the doses are heavier still: skipping the status rule totals 10.1 percent against the 7 percent bar, and a curve built on reported_date misses the youngest release five times over, because its triage queue is long enough to push almost all of its reports out of the early columns. One more fact is arithmetic: a release A days old has A+1 days of history in the file, the export date included, so a release exactly 60 days old has its whole sixty-day column and two complete columns, not one. 4.31 is 60 days old and its month-end close crashed for everyone on day 59, 156 crash reports inside its sixty-day column and none inside its thirty-day one, so a program that gives it only sixty days of history steps down to the thirty-day column and reads 155 against 288 reached, 46 percent off; on an ordinary release the two columns agree to within a report, which is why that batch is there.

The other product is a mobile line with 42 releases, an export date of its own, tickets that take half as long again to arrive, a defect rate that is rising rather than flat, and a crash reporter that went in at release 7.16 against 4.14 here, so every one of its seven forecast releases has it and a different share of their reports arrives within days. A forecast that carries the shipped numbers fails it, and so does one that carries the shipped curves: tickets that take half as long again to arrive fill a column at a different pace, so the shipped ticket curve read against that product's counts is wrong on every release. A program that reads the pattern off the export it is handed passes. The data are synthetic, generated by solution/gen_reports.py from a per-release intensity, a lognormal ticket delay and a short crash delay, and the key is the count each release reached by day 365 in that generation, on its own clock and net of the duplicate and invalid reports; solution/calibrate.py reproduces every figure above.

In a real business this job belongs to the engineer who owns the release quality metrics, and the mistake of reading the report counts of the newest releases as their quality is the single most common way a release trend gets called too early.
"""

solution_explanation = """
The reference (solution/solve.sh) installs src/forecast.adb and runs the project's build script, then runs the binary on /app/data. It reads policy.json for the export date and the forecast list, releases.csv for each release's date and whether it ships the crash reporter, and reports.csv for every report's release, source, status and opened_date.

For each release and each source it drops every report whose status is not open, then counts what is left opened by each thirty-day age measured from opened_date, the day itself included, twelve columns and then everything by day 365, keeping only the columns the export holds complete for that release: a release A days old has A+1 days of history, opened lags 0 to A, so the column at day N is complete once N is at most A, floor(A/30) of them, capped at twelve because the curve stops at 360 days. The arrival curve for a source is, at each thirty-day age, the pooled count over the finished releases (at least 365 days old) opened by then divided by what those releases held at day 365; tickets use every finished release, crash reports the finished releases that ship the reporter. A young release's figure for a source is its count by its last complete age divided by the curve at that age, and its forecast is the ticket figure plus the crash figure, rounded to an integer; a release that carries no crash reports adds a zero for that source, so the reporter column governs only which releases build the crash curve, not whether a release gets a crash term. A release at least 365 days old has its count in the file, and that count is its forecast; a release under thirty days old, or a source whose share at its age is zero, keeps its count as it stands. Everything is the Ada standard library. The policy reader checks the horizon before it reads anything else out of the file, takes any JSON whitespace between a colon and its value, a tab as readily as a space, and reads the horizon as the whole number token, sign, digits, fraction and exponent, refusing anything but the bare token 365 without converting it, so 0, 365.0, 365e0, a twenty-digit numeral, a quoted "365", true, null, a list or an object all get the same standard error line and exit 3 as a plain wrong figure.

On the shipped export the forecasts are 246, 469, 80, 195, 282 and 200 against counts reached of 242, 466, 80, 195, 288 and 200, the worst 2.1 percent off and the total 0.1; on the other product the forecasts are 187, 658, 618, 917, 535, 1229 and 637 against 191, 635, 614, 868, 564, 1190 and 637, the worst 5.6 percent off and the total 1.7. Across thirty generated products of each shape the reference's worst release is 17.6 percent off on the shipped shape and 7.7 on the other, inside every bar on every seed. The wrong routes are each a small change to the same program: oracle_to_date writes the counts as they stand, status and queue included, oracle_pooled_ladder builds one growth pattern from every report of every release, and oracle_rate_trend fits a line through reports per install of the mature releases and scales it by installs.
"""

verification_explanation = """
The verifier runs in its own container. It collects the agent's Ada sources, the build script and the shipped export as artifacts, compiles the project itself with gnatmake as an unprivileged build user, and runs the binary it produced, so the graded forecast always comes out of a clean build of the agent's own code. Collection strips src/ itself to its top-level *.adb and *.ads regular files, deleting every other entry the moment the project lands, and "every other entry" is meant literally rather than as a statement about file modes: a sub-directory and everything under it goes too, so a nested tree that carries its payload in its DIRECTORY NAMES is gone rather than merely unreadable, and so does a symbolic link, or anything else that is not a plain Ada source file. Nothing an ordinary GNAT project needs is lost, since the documented gnatmake -I src build compiles out of src/ itself and never had a sub-directory on its build path. /app/out is emptied on the same terms, being a collected path too, and the instruction states both. So nothing outside the Ada source is ever on disk under /app/forecast/src for a run to reach; the build directory holds only those files, copied out of the now-stripped src/, and is built with the same command build.sh documents (gnatmake -I src on src/forecast.adb), which compiles forecast.adb and whatever units it pulls in from src/ and leaves a unit nothing references alone, as the instruction says: a submission split into forecast.adb plus ordinary Ada helper packages builds exactly as it would from the project directory itself, and a helper written any other way is simply never copied in, so it cannot be linked into the program or reached by its build. The build script is not run, and the instruction says so: a script that did the work some other way would otherwise pass with the stub in place. Nothing in the project, in /app/out or in the export directory keeps an execute bit while the graded binary runs, so a helper carried in any collected path cannot do the work for it, and /app itself is root-owned and closed to the build user, so nothing can sit as a sibling of those directories and escape the sweep by not being under any of them.

Compiling and running means the verifier executes code the agent wrote, so it does not do that as root. test.sh hands the project to the build user through setpriv with supplementary groups cleared and no-new-privileges set, runs the binary from /app/forecast, the directory the instruction documents, and while it runs every executable on the system paths is closed to that user, found by walking the directories rather than by a list, so the forecast cannot come out of a Python the binary shells out to; the cheat_python_shim arm is that construction and scores 0. Closing the system paths would still leave an executable helper shipped inside the agent's own project runnable, since that directory is collected as an artifact, so every file under /app/forecast except the binary the verifier has just built loses its execute bits before either graded run, and its read bits too, because the loader only has to read a shared object to use one. That sweep runs on the build script as well, whatever mode it happened to ship with, and on every sub-directory, whose names are closed off for the same reason a file's contents are; the instruction states that nothing under /app/forecast but the binary is readable while it runs, so a program that needed a table of its own alongside the binary is not being failed by surprise. Scratch space is the remaining route: Interfaces.C is part of the Ada standard library, so a program could carry a helper as bytes, write it to /tmp, mark it executable and run it, or spool through a temporary file and unlink it before anyone looks. A listing taken before and after a call only sees what is still there when the call ends, so the build user is given nowhere to create anything: from the moment the build finishes, everything under /app is root-owned, the runner's home and /tmp, /var/tmp, /dev/shm and /dev/mqueue are root-only, and test.sh walks the whole file system as the build user and requires the list of writable directories and regular files to come back empty, closing whatever it finds and abandoning the run if anything still answers writable. The one file an invocation may write is its own output, which test.sh creates empty for it, owned by the build user, inside a root-owned directory, and records by size and timestamps: the program can write over it and cannot create anything beside it, in /tmp, in its home or anywhere else. What is checked is the file's state when the program exits, and the instruction says exactly that: when it exits, the output file holds the JSON and nothing has been written anywhere else, and the output path may already exist as an empty file. A program that spools a line of scratch text into that file first and then writes the JSON over it has kept the contract, and the oracle_rewrites_output arm is that program and scores 1. Every single invocation of the binary runs under the same conditions, not only the graded runs: each argument-count and horizon probe gets the identical closing of the project tree and the identical handed-out output file, so a probe is never a window in which the collected build script could be read and staged for a later run. The before/after listing of every non-directory entry under /tmp, /var/tmp, /dev/shm, /home/runner and /app entire stays as a belt: nothing can appear in it any more, and it reports loudly if the lockdown ever regresses. The cheat_transient_file arm is the reference plus a scratch file written, closed and deleted inside every invocation (beside the JSON on a graded run, in /tmp on the usage path), which a listing could never see and which scored 1 before this lockdown; now the create is refused, the probes exit 1 instead of 2 and the graded runs write no JSON, so it scores 0. The cheat_extra_output arm is the reference that also drops an ordinary chmod 644 log beside the binary during each run, and the cheat_scratch_leftover arm is the reference leaving a mode 0644 helper file in /tmp; neither create is allowed, both runs die before their JSON, and both score 0. The cheat_native_helper arm copies the binary itself into /tmp, marks it executable, execs that copy to do the whole job and deletes it before exit; the dynamic loader is left open like any other shared object, because closing it also stops an ordinary dynamically linked GNAT binary from launching during the credential transition setpriv makes, but the copy can no longer be written anywhere, so the arm dies on the create and scores 0. A stray file the project happened to ship, such as the chmod 644 file the oracle_extra_file arm puts beside the real solution or the chmod 755 one the oracle_extra_exec_in_src arm puts there with an executable build script beside it, is not held against the run at all: collection deletes both before the build starts, so neither is ever compiled, run or graded, and both arms score exactly what the real solution scores. Each run happens in its own session and its process group is torn down afterwards, then every process that user still owns is swept, so nothing the agent started is alive when the reward is written. The graded runs ask for different output paths, each a fresh basename test.sh draws at random, so a program that ignores the second argument and writes a fixed file produces nothing for the run it was not written for; the same generator names every argument-count and horizon probe's output path too, so no run's basename says whether it is one of the graded runs or a probe. Every invocation's standard output and standard error are captured into files whose names are drawn from /dev/urandom as well, graded run and probe alike, and a probe's captures are renamed to its tag only after the process is gone: the binary can read the path behind its own descriptor 1 back from /proc even though it cannot list /opt, and that path now says nothing about which kind of run it is in. The cheat_fd_path arm refuses a horizon only when that path names a horizon probe, scored 1 while the captures were named after their probe, and scores 0. The output is staged only if it is a regular file, moved to a root-owned path, and pytest reads that with O_NOFOLLOW; pytest never runs the agent's binary. The keys live under /opt, readable only by root, and the /tests mount is closed to the build user before anything untrusted starts; if it is still reachable the run is abandoned with reward 0. test.sh sets its file-creation mask to 077 before it creates anything, so every capture, every staged copy and every record of what the run drew is root-only from the moment it exists, and the records of the drawn horizons and the drawn argument count sit in a directory nobody else can enter, so the binary, running as the build user between two probes, can never read what has been drawn so far and recognize the case it is in. pytest is called by full path with -P so nothing dropped into the working directory can shadow it.

Then the same binary is run on the other product's export, staged into a fresh root-owned directory only after the build has finished and its processes are gone, with its own README, and removed afterwards; the horizon probes are staged the same way from a root-owned copy of the shipped export taken before any agent code ran, so a symlink planted in /app/data is never followed by root on the way in. Every staged directory is drawn from the same bare mktemp template, and every probe and graded run alike is launched through the identical root-shell-to-setpriv chain and asked for the same kind of randomly generated output basename, so a program cannot single out a probe by argv, launch shape or output name and answer only that one differently from a graded run. That product has 42 releases, its own export date, tickets that take half as long again to arrive, a rising defect rate, a crash reporter that went in at a different release and a policy file its tracker lays out with a tab after each colon where the shipped one has a space, so its curves and its forecasts are its own and a policy reader that takes only a space for JSON whitespace refuses the 365-day horizon it was handed. Both exports carry, on purpose, a release on every edge a reader can get wrong, each generated from its own random stream: one exactly 365 days old, installed far more widely than an ordinary release and shipped with an early crash-reporter build that uploaded on a monthly sync, so every one of its crash reports is opened on day 30, 60 or 90 exactly, leaving it out of the cohort moves the thirty-day crash share by well over the bar, and reading "opened by day 30" as "before day 30" drops its whole day-30 batch and moves the same share by as much again, while every forecast release divides by a later column the release no longer disturbs; one aged 400 days and kept on the forecast list, whose count is in the file, so a program has to handle a release the curve has nothing left to say about; one aged exactly 60 days, on a column edge, where a program that gives a release only as many days of history as its age reads the thirty-day column instead of the sixty-day one; and one release from before the crash reporter shipped that carries a real batch of crash reports from a pilot build that phoned them home in slow weekly syncs, its own crash_reporter column still reading no, so a curve that pools crash reports by whether a release happens to carry any, rather than by that column, comes out visibly slower than the correct one. The shipped export also carries a duplicate storm on one finished release and a triage queue a couple of weeks long, each sized so that the curve built without the fact it stands for misses the visible export's own curve bar; the other product carries an age-210 release as a second column-edge case and heavier doses of both facts.

Eighty-two checks run and every one of them is a requirement instruction.md states. Every file shipped in /app/data, the three tracker files and the README, is unaltered by sha256 and nothing has been added or removed. The instruction promises a line on standard error, empty standard output, exit 2 and nothing written for any argument count other than two; the verifier runs every count from zero through forty, forty probes rather than a handful, and one more count drawn from 41 to 5000 on every run and printed in the log, so a program that refuses a few counts and answers another normally, or stops refusing past the fixed loop, is caught; the oracle_argc_cutoff arm refuses only argument counts up to forty and scores 0 on the drawn one. Each has to put a line on standard error, newline-terminated, since the instruction says a line is printed (the oracle_usage_no_newline arm uses Put in place of Put_Line there and scores 0), leave standard output empty, exit 2 and leave the output file it was handed untouched, checked by that file's size and timestamps against the record taken when it was handed out; standard output is compared as the exact bytes captured, so a lone newline is not empty (the cheat_whitespace_stdout arm is the reference plus one New_Line on that path and scores 0); a call of zero or one arguments names no such path at all, so there is nothing more to check there than exit status and standard error; every one of these probes, and every horizon probe below, runs with the project closed exactly as a graded run does and has to pass the same leftover-file check. The instruction does not fix the wording of what reaches standard error, so nothing narrower than non-empty is enforced there. The instruction promises exit 3, a line on standard error and nothing written for any horizon_days that is not the bare token 365, names 365.0 and 365e0 as other spellings and so other horizons, and says that the rule is tried on values of each kind, some fixed and some drawn at random every time: a rule over every JSON value cannot be run to exhaustion, so it is sampled, and the sampling is disclosed. Both graded exports say 365, so without cases of its own a program that never read the key would pass. Twenty-five are probed: seventeen fixed (zero, which a parser that reads it as unset and falls back to 365 answers instead of refusing, and the oracle_zero_default arm is that parser and scores 0 on it alone; thirty, ninety, both neighbors of 365, two values further out, a twenty-digit numeral no integer type holds, 365.0, 365e0, 3.65e2 and 3650e-1, four JSON numbers that begin with the digits 365 and are not the bare token, which a parser that stops at the first non-digit reads as 365, and five values of another JSON type, the string "365", true, null, [365] and {"v":365}, which a parser that coerces a quoted numeral, or skips ahead to the first digits it finds, reads as 365) and eight drawn from /dev/urandom on every run and printed in the log, four integers across 1..10000 other than 365, a negative, a fraction, an exponent form and a numeral of twenty to forty digits, so the set of values a program would have to know is not a set at all, and a check on the record of the draw fails if fewer than eight were drawn; the line on standard error is held to the same newline rule as the usage line, and nothing is asked of standard output on that path, so nothing is checked. The oracle_coerce_string arm steps over the quotes around a numeral and scores 0 on the string-typed probe alone. On each of the two runs: the output is one object with exactly the keys reports_by_day_365 and arrival_share; the forecast's keys are exactly that export's forecast_releases and its values non-negative integers; every forecast is within the policy's tolerance_per_release of the count the release reached by day 365; the summed forecasts are within tolerance_total of the summed counts; the arrival curve carries a ticket and a crash series at every thirty-day age from 30 to 360, each a share between 0 and 1; and every point of each series is within 0.05 of the curve the export's own finished releases carry, recomputed from the run's own input files under the four facts the README states and the instruction's "opened by that age, the day itself included". No check ties the forecast to the printed curve by any formula, and no check reads the method back off the source: the forecast is graded on the count reached and the curve on the finished releases, and the method section of the README is what produces both in the reference. One check is on the fixture rather than on the run: each export has to carry a forecast release exactly on a column edge on which the figure read off the column below misses the count reached by more than that policy's tolerance_per_release, so the arithmetic fact the README states bites on the visible export and a regeneration that dropped the case fails loudly; that is the shipped 4.31, 155 against 288, and the other product's 7.41, 1548 against 1190.

The key is what each release actually reached, net of anything the tracker marked duplicate or invalid: the generator draws every report with its delay and its status, and the key is the number per release that arrived open by day 365, so the forecast bars are performance bars on the agent's numbers against labels the verifier holds, in the same shape as a retrieval task scored against an answer key. The arrival curve is graded differently and deliberately so: the verifier recomputes it from the finished releases in the very export the run was handed, so that check compares the run against its own input and holds nothing back. It also binds, and the instruction defines what it binds to: the share of the finished releases' day-365 reports taken together as one pile, opened by that age with the day itself included, not the mean of the releases' own shares and not the reports opened before that day. Both exports carry one very large, slow release among the finished ones (4.32, 7.39), so the readings are far apart: the oracle_mean_of_releases arm averages the releases' own shares with equal weight and reads the thirty-day crash point at 0.938 against 0.746 on the shipped export and 0.965 against 0.717 on the other, four times the bar, and the oracle_exclusive_age arm reads every column as opened before the day and reads that point at 0.491 against 0.746 and the sixty-day point at 0.750 against 0.996 on the shipped export, 0.425 and 0.717 against 0.717 and 0.995 on the other, and overshoots the age-60 release by 23 percent on both; both arms score 0. Each of the four README facts missed moves a point of the shipped curve by 0.10 to 0.25 and a curve pooled over both sources misses by more than 0.1 on both products. Thirty-six arms run through the real verifier beside the oracle, every one of them a one-change variant of the reference; the wrong readings each score 0 on the assertion they were built to fail. oracle_to_date and oracle_rate_trend fail the forecast bars on both products (4.28 at 129 against 195 and the shipped total 14.2 percent under; the trend 85 percent out on 4.27). oracle_pooled_ladder fails the shipped forecast bars, 4.31 at 437 against 288 and the total 14.1 percent over, and the curve bar on both runs, its shipped ticket points 0.13 and 0.15 above the finished releases at 30 and 60 days. oracle_frozen_curve, the growth pattern measured once on this product and written into the source, and cheat_frozen, the shipped forecasts written into the source, each pass the shipped run whole and fail the other product. oracle_short_history gives a release A days old only A days of history and fails the shipped export's 60-day 4.31, 155 against 288 reached, and the other product's 7.41, 1548 against 1190. oracle_strict_cohort tightens the finished cohort from at least 365 days to more than 365 and fails the curve bar on both exports, the shipped thirty-day crash share printed at 0.992 against 0.746. oracle_ignores_reporter pools every finished release into the crash curve whether or not it ships the reporter and fails the curve bar on both runs, the shipped thirty-day crash share at 0.590 against 0.746 and the sixty-day at 0.857 against 0.996. oracle_status_in_curve drops duplicate and invalid reports from the young releases' own counts but pools them into the curve and fails the curve bar on both runs, 0.494 against 0.403 at sixty days and 0.690 against 0.547 at ninety on the shipped export, and the other product's totals. oracle_reported_curve reads opened_date for the counts and reported_date for the curve and fails the curve bar on both runs, 0.103 against 0.204 at thirty days on the shipped export, and the other product's forecast bars. oracle_gnat_unit, which reaches for one of the compiler's own convenience packages, and cheat_python_shim, which tries to hand the work to a python one-liner, both fail to build: the GNAT hierarchy is taken out of both images, so a submission that reaches past the standard library does not compile rather than being trusted not to, and every interpreter is closed while the binary runs in any case. cheat_probe_basename answers "wrong horizon" from a fixed output basename instead of ever reading horizon_days out of policy.json; every run asks for a randomly generated basename, graded and probed alike, so that name never appears, every horizon probe falls through into an ordinary run, and it scores 0 for writing a real report where the horizon checks require exit 3 and nothing written. oracle_prefix_parse is the reference with a horizon parser that compares only the run of digits after the colon, so 365.0 and 365e0 read as 365; it answers those two probes with a report and exit 0 and scores 0 on them. cheat_src_dir_data carries its payload in DIRECTORY NAMES under src, src/cache/k0405, and in no regular file at all, and refuses to produce output without them; collection deletes every entry under src that is not a top-level Ada source, so it scores 0. cheat_probe_stage copies the collected build script to /tmp during the zero-argument probe and refuses to work in a graded run without it; every invocation runs with the project closed and gets the same listing, so it scores 0. cheat_delete_readme is the real solution with /app/data/README.md deleted afterward, everything else in the export untouched: it scores 0 because README.md is one of the files sha256 checks against the shipped copy, and the instruction says the whole directory stays as it arrived, not just the three files a program reads. Seven arms score 1 rather than 0, to prove the verifier does not false-reject: oracle_two_decimals prints every arrival share to two decimals, which meets every stated bar; oracle_no_cap never caps its column count at twelve, so on the 400-day release it reads the day-365 count straight off the file, which is what the method in the README says a finished release gets; oracle_rewrites_output spools scratch text into its output file before the JSON, which the final-state wording allows; oracle_multi_unit splits the reference into forecast.adb plus an ordinary helper package, oracle_extra_file ships a stray, non-executable file in src/ beside the real solution, and oracle_extra_exec_in_src ships a stray executable file there and leaves the build script executable too; the build directory takes every *.adb/*.ads file it is given and nothing else, and every run strips execute bits from everything else under /app/forecast regardless of its mode going in, so the split submission builds and runs like any other and the two stray files are simply never copied in, never linked, and never graded on their own account. oracle_extra_dir is the reference that also asks Ada.Directories, part of the standard library, for an empty directory beside the binary and goes on when that is refused, as it now always is; the program is otherwise the reference and scores 1. solution/gen_reports.py regenerates both products byte for byte, the shipped export and key with no arguments and the other product's with --hidden.
"""

relevant_experience = """
I have authored a batch of tasks for this edition, several of them accepted, on one finding: the tasks that measure something are the ones where the agent's own reading of the evidence confirms the wrong answer. Here the wrong answer is the review's table, reproducible to two decimals from the files shipped, and the forecast that works has to see that a young release's count is unfinished and that the two kinds of report finish on different clocks. The product is the forecast rather than a rate or an effect because a count a release reached is a fact the verifier can hold, the same shape as a list scored against an answer key.
"""

[verifier]
# One compile and two runs of the agent's program. gnatmake is fast and there is no dependency
# tree, but 1800 is the floor the platform requires.
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
# Offline by design: the tool is written against the Ada runtime, and network access would let
# the agent pull a forecasting package rather than look at the export.
network_mode = "no-network"

[environment]
# Must be "public" on every task, offline ones included: this is the phase where the image is
# built and the agent harness is installed.
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
